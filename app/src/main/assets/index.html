<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Gym Tracker Pro</title>
<style>
:root{--bg:#000;--card:#202022;--field:#080809;--green:#36f27b;--muted:#a7a7ab;--line:#343438;--white:#f5f5f7}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-size:16px}body{padding-bottom:92px}.app{max-width:430px;margin:0 auto;padding:42px 15px 18px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.topbtn{color:var(--green);font-size:15px;background:none;border:0}.day{font-size:16px;color:#d5d5d8;font-weight:700;margin:2px 2px 12px}.card{background:var(--card);border-radius:28px;padding:17px 15px;margin:0 0 18px;box-shadow:0 1px 0 rgba(255,255,255,.03)}.exercise-head{display:flex;justify-content:space-between;gap:10px}.exercise-title{font-size:17px;font-weight:800}.modify{color:var(--green);border:0;background:none;font-size:16px}.muscle{color:var(--green);font-size:12px;font-weight:800;text-transform:uppercase;margin-top:3px}.sub{color:#9b9b9f;font-size:13px;margin-top:4px}.recovery{display:flex;align-items:center;gap:10px;margin:14px 0}.recovery b{font-size:13px}.time{background:#000;border-radius:4px;padding:8px 9px;font-size:17px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr 35px 28px;gap:7px;align-items:center;margin:8px 0}.setlabel{font-weight:800;font-size:13px}.field{height:36px;background:#000;border:0;border-radius:5px;color:#fff;font-size:16px;padding:0 9px;outline:none;width:100%}.kg{color:var(--green);font-size:12px;font-weight:700}.check{width:21px;height:21px;border:2px solid #f1f1f1;border-radius:50%;background:transparent;appearance:none}.check:checked{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 4px #000}.back{font-size:12px;color:#8ff5b1;margin-left:34px;margin-top:-2px}.series{display:flex;gap:9px;margin:12px 0 6px}.pill{background:#102d1b;color:var(--green);border:0;border-radius:18px;padding:8px 12px;font-size:15px}.count{margin-left:auto;color:#9b9b9f;font-size:12px;align-self:center}.map{width:100%;height:190px;object-fit:cover;border-radius:25px;background:#ddd;margin-top:10px}.bottom{position:fixed;z-index:20;bottom:10px;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));height:67px;background:#1d1d1f;border-radius:34px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.7);border:1px solid #2e2e31}.nav{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}.nav .ico{font-size:22px;line-height:20px}.nav.active{color:var(--green)}.nav.active .ico{background:#303033;border-radius:22px;padding:7px 13px;margin-top:-14px}.section-title{font-size:25px;font-weight:900;margin:0 0 18px}.label{color:#a7a7ab;font-weight:700;font-size:15px;margin:0 2px 8px}.inputcard{background:var(--card);border-radius:28px;padding:2px 15px;margin-bottom:18px}.lineinput{width:100%;height:52px;background:transparent;border:0;border-bottom:1px solid var(--line);color:#fff;font-size:16px;outline:none}.lineinput:last-child{border-bottom:0}.rowbetween{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);min-height:56px}.stepper{display:flex;align-items:center;background:#454548;border-radius:20px;overflow:hidden}.stepper button{width:45px;height:34px;border:0;background:transparent;color:#fff;font-size:23px}.toggle{width:58px;height:32px;border-radius:20px;background:#777;position:relative;border:0}.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff}.toggle.on{background:var(--green)}.toggle.on i{left:29px}.primary{width:100%;height:53px;border:0;border-radius:27px;background:var(--card);color:var(--green);font-size:16px;text-align:left;padding:0 17px;margin-bottom:18px}.metricrow{display:flex;gap:10px}.metric{flex:1;background:var(--card);border-radius:22px;padding:13px}.metric small{color:#aaa}.metric strong{font-size:24px;display:block;margin-top:3px}.bar{height:7px;background:#333;border-radius:7px;margin:14px 0 20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0}.chart{height:230px;background:var(--card);border-radius:25px;padding:15px;display:flex;align-items:flex-end;gap:9px}.col{flex:1;background:var(--green);border-radius:7px 7px 2px 2px;min-height:4px}.setting{background:var(--card);border-radius:25px;padding:0 16px;margin-bottom:15px}.setting .rowbetween{border-bottom:1px solid var(--line)}.setting .rowbetween:last-child{border-bottom:0}.accent{display:flex;gap:8px}.dot{width:24px;height:24px;border-radius:50%;border:2px solid #777}.purple{background:#af52de}.blue{background:#0a84ff}.green{background:#34c759}.orange{background:#ff9500}.red{background:#ff3b30}.pink{background:#ff2d55}.hidden{display:none}.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:#242426;padding:10px 16px;border-radius:18px;color:var(--green);z-index:30;font-size:13px}
</style></head><body><div id="root"></div><div class="bottom" id="nav"></div><script>
const DAYS=['LUNEDÌ','MARTEDÌ','MERCOLEDÌ','GIOVEDÌ','VENERDÌ','SABATO','DOMENICA'];
const muscles={PETTO:'Pettorali e tricipiti',DORSO:'Dorsali, romboidi e trapezio',SPALLE:'Deltoidi e spalle',GAMBE:'Quadricipiti e femorali',BRACCIA:'Bicipiti e tricipiti'};
const defaults={LUNEDÌ:[['Spinte manubri panca 32','PETTO','3','7-9','2:00'],['Lat Pulldown','DORSO','3','7-9','2:00'],['Chest Press','PETTO','3','8-10','2:00'],['T-Bar prona larga','DORSO','3','8-10','1:30'],['Alzate laterali','SPALLE','3','10-12','1:30'],['Push Down asta curva','BRACCIA','3','10 RM','1:30'],['Curl cavo basso','BRACCIA','3','10 RM','1:30']],MARTEDÌ:[['Leg Extension','GAMBE','3','12 RM','1:30'],['Leg Press 45','GAMBE','3','7-9','2:00'],['Leg Curl sdraiato','GAMBE','2','10-12','1:30'],['Adduttori','GAMBE','2','10-12','1:30'],['Calf Machine','GAMBE','3','8-10','1:30']],MERCOLEDÌ:[['Panca piana bilanciere','PETTO','3','7-9','2:00'],['Rematore bilanciere','DORSO','3','7-9','2:00'],['Lento avanti manubri panca 71','SPALLE','3','8-10','2:00'],['Rowing','DORSO','3','8-10','1:30'],['Stacchi rumeni manubri','GAMBE','3','7-9','2:00'],['Leg Curl seduto','GAMBE','2','12 RM','1:30'],['Arm Curl','BRACCIA','3','10 RM','1:30'],['French Press manubri','BRACCIA','3','10 RM','1:30']],GIOVEDÌ:[],VENERDÌ:[],SABATO:[],DOMENICA:[]};
let data=JSON.parse(localStorage.gymData||'null')||Object.fromEntries(DAYS.map(d=>[d,(defaults[d]||[]).map(x=>({name:x[0],muscle:x[1],sets:Array.from({length:+x[2]},()=>({reps:x[3],weight:20,done:false})),recovery:x[4],back:false}))]));let page='workout',day=DAYS[new Date().getDay()-1]||'LUNEDÌ'; if(!DAYS.includes(day))day='LUNEDÌ';let editing=false;
function save(){localStorage.gymData=JSON.stringify(data)} function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1300)}
function nav(){document.getElementById('nav').innerHTML=[['workout','▣','Scheda'],['progress','⌁','Progressi'],['add','⊕','Aggiungi'],['settings','⚙','Impostazioni']].map(n=>`<button class="nav ${page==n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span><span>${n[2]}</span></button>`).join('')}
function go(p){page=p;editing=false;render()}
function render(){nav();let r=document.getElementById('root');if(page==='workout')r.innerHTML=workout();if(page==='progress')r.innerHTML=progress();if(page==='add')r.innerHTML=add();if(page==='settings')r.innerHTML=settings()}
function workout(){let ex=data[day]||[];let total=ex.reduce((a,e)=>a+e.sets.length,0),done=ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);return `<div class="app"><div class="top"><div class="brand">GYM TRACKER PRO</div><button class="topbtn" onclick="toast('Importazione scheda')">⌁</button></div><div class="day"><select class="field" style="background:#202022;width:100%;border-radius:28px;height:50px" onchange="day=this.value;render()">${DAYS.map(d=>`<option ${d===day?'selected':''}>${d}</option>`).join('')}</select></div><div class="metricrow"><div class="metric"><small>Esercizi</small><strong>${ex.length}</strong></div><div class="metric"><small>Serie</small><strong>${total}</strong></div><div class="metric"><small>Completate</small><strong>${done}</strong></div></div><div class="bar"><i style="width:${total?done/total*100:0}%"></i></div>${ex.length?ex.map((e,i)=>card(e,i)).join(''):`<div class="card"><b>Nessun allenamento</b><div class="sub">Questo giorno è libero.</div></div>`}</div>`}
function card(e,i){return `<div class="card"><div class="exercise-head"><div><div class="exercise-title">${e.name}</div><div class="muscle">${e.muscle}</div><div class="sub">${muscles[e.muscle]||''}</div></div><button class="modify" onclick="editing=!editing;render()">${editing?'Fine':'Modifica'}</button></div><div class="recovery"><b>Recupero</b><span class="time">${e.recovery}</span></div>${e.sets.map((s,j)=>`<div class="setrow"><span class="setlabel">S${j+1}</span><input class="field" value="${s.reps}" ${s.back?'disabled':''} onchange="setReps(${i},${j},this.value)"><input class="field" value="${s.weight}" ${s.back?'disabled':''} onchange="setWeight(${i},${j},this.value)"><span class="kg">kg</span><input class="check" type="checkbox" ${s.done?'checked':''} onchange="doneSet(${i},${j},this.checked)"></div>${s.back?'<div class="back">Back-off −20%</div>':''}`).join('')}${editing?`<div class="rowbetween" style="margin-top:10px"><span>Back-off ultima serie</span><button class="toggle ${e.back?'on':''}" onclick="toggleBack(${i})"><i></i></button></div>`:''}<div class="series"><button class="pill" onclick="addSet(${i})">+ Serie</button><button class="pill" onclick="removeSet(${i})">− Serie</button><span class="count">${e.sets.length} serie${e.sets.length!=1?'':' '}</span></div>${i<3?`<img class="map" src="file:///android_asset/muscle_map.png">`:''}</div>`}
function setWeight(i,j,v){let n=parseFloat(v)||0;if(data[day][i].sets[j].back)return;data[day][i].sets[j].weight=n;save();if(data[day][i].back&&j===data[day][i].sets.length-2)data[day][i].sets.at(-1).weight=Math.round(n*.8*2)/2;render()}
function setReps(i,j,v){data[day][i].sets[j].reps=v;save()}
function doneSet(i,j,v){data[day][i].sets[j].done=v;save();if(v)toast('Recupero avviato');}
function addSet(i){let e=data[day][i],last=e.sets[e.sets.length-(e.back?2:1)]||{reps:'8-10',weight:20};if(e.back)e.sets.splice(e.sets.length-1,0,{reps:last.reps,weight:last.weight,done:false});else e.sets.push({reps:last.reps,weight:last.weight,done:false});save();render()}
function removeSet(i){let e=data[day][i],idx=e.back?e.sets.length-2:e.sets.length-1;if(idx>0){e.sets.splice(idx,1);save();render()}}
function toggleBack(i){let e=data[day][i];if(!e.back){let s=e.sets.at(-1);e.sets.push({reps:s.reps,weight:Math.round(s.weight*.8*2)/2,done:false,back:true});e.back=true}else{e.sets.pop();e.back=false}save();render()}
function progress(){let vals=[];DAYS.forEach(d=>(data[d]||[]).forEach(e=>e.sets.filter(s=>!s.back).forEach(s=>vals.push(s.weight))));let max=Math.max(20,...vals);return `<div class="app"><h1 class="section-title">Progressi</h1><div class="card"><div class="sub">Andamento dei pesi registrati</div><div class="chart">${vals.slice(-18).map(v=>`<div class="col" style="height:${Math.max(4,v/max*180)}px"></div>`).join('')}</div></div>${DAYS.map(d=>(data[d]||[]).length?`<div class="card"><b>${d}</b>${data[d].map(e=>`<div style="padding:10px 0;border-bottom:1px solid #343438"><b>${e.name}</b><div class="sub">${e.sets.filter(s=>!s.back).map(s=>s.weight+' kg').join(' · ')}</div></div>`).join('')}</div>`:'').join('')}</div>`}
function add(){let sets=3,back=false;return `<div class="app"><h1 class="section-title">Aggiungi esercizio</h1><div class="label">Giorno</div><div class="inputcard"><select id="newday" class="lineinput">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="label">Esercizio</div><div class="inputcard"><input id="newname" class="lineinput" placeholder="Nome"><input id="newreps" class="lineinput" value="8-10"><div class="rowbetween"><span>Serie normali: <b id="sc">3</b></span><div class="stepper"><button onclick="sets=Math.max(1,sets-1);sc.textContent=sets">−</button><button onclick="sets++;sc.textContent=sets">+</button></div></div><div class="rowbetween"><span>Aggiungi back-off −20%</span><button class="toggle" id="bt" onclick="back=!back;this.classList.toggle('on',back)"><i></i></button></div><input id="newrec" class="lineinput" value="2:00"></div><div class="label">Kg per serie normale</div><div class="inputcard" id="weights">${[1,2,3].map(i=>`<input class="lineinput wnew" value="20">`).join('')}</div><button class="primary" onclick="addExercise(${sets},${back})">Aggiungi alla scheda</button></div>`}
function addExercise(n,b){let d=document.getElementById('newday').value,name=document.getElementById('newname').value.trim()||'Nuovo esercizio',reps=document.getElementById('newreps').value,rec=document.getElementById('newrec').value,ws=[...document.querySelectorAll('.wnew')].map(x=>parseFloat(x.value)||20);let ss=Array.from({length:n},(_,i)=>({reps,weight:ws[i]??ws.at(-1)??20,done:false}));let e={name,muscle:'PETTO',sets:ss,recovery:rec,back:false};if(b){let s=ss.at(-1);e.sets.push({reps:s.reps,weight:Math.round(s.weight*.8*2)/2,done:false,back:true});e.back=true}data[d].push(e);save();toast('Esercizio aggiunto');setTimeout(()=>go('workout'),500)}
function settings(){return `<div class="app"><h1 class="section-title">Impostazioni</h1><div class="setting"><div class="rowbetween"><span>Tema scuro</span><button class="toggle on"><i></i></button></div><div class="rowbetween"><span>Colore accento</span><div class="accent">${['purple','blue','green','orange','red','pink'].map(c=>`<button class="dot ${c}" onclick="toast('Colore aggiornato')"></button>`).join('')}</div></div></div><div class="setting"><div class="rowbetween"><span>Notifiche recupero</span><button class="toggle on"><i></i></button></div><div class="rowbetween"><span>Scheda di oggi</span><span style="color:var(--green)">${day}</span></div></div></div>`}
render();
</script></body></html>
