plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gymtrackerpro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gymtrackerpro.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
